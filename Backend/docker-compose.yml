version: "3.8"

services:
  backend:
    build: .
    image: backend-backend
    container_name: backend
    ports:
      - "8080:8080"
    restart: unless-stopped

  proxy:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
      - ./npm/ssl:/etc/ssl/nginx

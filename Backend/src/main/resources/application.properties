# ==================================================
# LIBRARY APP — DEVELOPMENT CONFIGURATION
# ==================================================

# --------------------------------------------------
# APPLICATION
# --------------------------------------------------
spring.application.name=library-backend-dev


# --------------------------------------------------
# DATABASE — H2 (IN-MEMORY, DEV ONLY)
# --------------------------------------------------
spring.datasource.url=jdbc:h2:mem:libappdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false


# --------------------------------------------------
# JPA / HIBERNATE
# --------------------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# Hibernate tuning
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=10

# Initial SQL data
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql


# --------------------------------------------------
# JWT AUTHENTICATION (DEV)
# --------------------------------------------------
# Secret key used to sign JWT tokens (DEV ONLY)
jwt.secret=DevelopmentSecretKey123456789012345678901234567890

# JWT expiration time (24 hours in milliseconds)
jwt.expiration.ms=86400000


# --------------------------------------------------
# CORS CONFIGURATION (PERMISSIVE — DEV)
# --------------------------------------------------
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8081,http://10.109.3.52:8081,http://10.109.25.26:8081
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept,Cache-Control,Origin
app.cors.exposed-headers=Authorization,Content-Type,Content-Disposition
app.cors.max-age=3600
app.cors.allow-credentials=true


# --------------------------------------------------
# EXTERNAL SERVICES
# --------------------------------------------------
# OpenLibrary API
app.external.openlibrary.url=https://openlibrary.org

# Timeout in milliseconds (5 seconds)
app.external.openlibrary.timeout=5000


# --------------------------------------------------
# LOGGING (VERBOSE — DEV)
# --------------------------------------------------
logging.level.com.libapp.backend=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# --------------------------------------------------
# SERVER
# --------------------------------------------------
server.port=8080
server.servlet.context-path=/
server.error.include-message=always
server.error.include-stacktrace=always


# --------------------------------------------------
# SPRING SECURITY (DEV)
# --------------------------------------------------
spring.security.filter.order=10


# --------------------------------------------------
# DEVTOOLS & MONITORING
# --------------------------------------------------
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
